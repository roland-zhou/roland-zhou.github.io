<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content">
    <meta name="theme-color" content="#f6f3ee" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#171717" media="(prefers-color-scheme: dark)">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="ai问记">
    <title>ai问记</title>
    <link rel="icon" type="image/svg+xml" href="./favicon.svg">
    <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png">
    <link rel="manifest" href="./manifest.webmanifest">
    <link rel="stylesheet" href="./style.css?v=1">
    <link rel="stylesheet" href="../shared/cloud-sync.css">
    <script type="module" src="./app.js?v=1"></script>
</head>
<body>
    <svg class="sprite" aria-hidden="true">
        <symbol id="i-cloud" viewBox="0 0 24 24">
            <path d="M7.5 18h9.8a3.7 3.7 0 0 0 .5-7.35A5.3 5.3 0 0 0 7.4 9.2 4.2 4.2 0 0 0 7.5 18Z"/>
        </symbol>
        <symbol id="i-cloud-check" viewBox="0 0 24 24">
            <path d="M7.5 18h9.8a3.7 3.7 0 0 0 .5-7.35A5.3 5.3 0 0 0 7.4 9.2 4.2 4.2 0 0 0 7.5 18Z"/>
            <path d="m9.5 13.5 1.7 1.7 3.5-3.7"/>
        </symbol>
        <symbol id="i-cloud-up" viewBox="0 0 24 24">
            <path d="M7.5 18h9.8a3.7 3.7 0 0 0 .5-7.35A5.3 5.3 0 0 0 7.4 9.2 4.2 4.2 0 0 0 7.5 18Z"/>
            <path d="M12 15.5v-4.5M9.8 13 12 10.8 14.2 13"/>
        </symbol>
        <symbol id="i-cloud-alert" viewBox="0 0 24 24">
            <path d="M7.5 18h9.8a3.7 3.7 0 0 0 .5-7.35A5.3 5.3 0 0 0 7.4 9.2 4.2 4.2 0 0 0 7.5 18Z"/>
            <path d="M12 10.5v3M12 15.8h.01"/>
        </symbol>
        <symbol id="i-sync" viewBox="0 0 24 24">
            <path d="M20 12a8 8 0 0 0-13.7-5.6L4.5 8.2M4.5 4.5v3.7h3.7"/>
            <path d="M4 12a8 8 0 0 0 13.7 5.6l1.8-1.8M19.5 19.5v-3.7h-3.7"/>
        </symbol>
        <symbol id="i-copy" viewBox="0 0 24 24">
            <rect x="9" y="9" width="10.5" height="10.5" rx="2"/>
            <path d="M6.5 15H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h7a2 2 0 0 1 2 2v.5"/>
        </symbol>
        <symbol id="i-edit" viewBox="0 0 24 24">
            <path d="M14.5 5.5l4 4M4.5 19.5l1-4.5L16 4.5a1.4 1.4 0 0 1 2 0l1.5 1.5a1.4 1.4 0 0 1 0 2L9 18.5z"/>
        </symbol>
        <symbol id="i-trash" viewBox="0 0 24 24">
            <path d="M4.5 7h15M9.5 7V4.5h5V7M6.5 7l.8 12.5h9.4L17.5 7M10 11v5M14 11v5"/>
        </symbol>
        <symbol id="i-check-circle" viewBox="0 0 24 24">
            <circle cx="12" cy="12" r="9"/>
            <path d="m8.4 12.3 2.4 2.4 4.9-5.1"/>
        </symbol>
        <symbol id="i-turn-down-right" viewBox="0 0 24 24">
            <path d="M6 5v7a3 3 0 0 0 3 3h9"/>
            <path d="m14.5 11.5 3.5 3.5-3.5 3.5"/>
        </symbol>
        <symbol id="i-chevron-right" viewBox="0 0 24 24">
            <path d="m9.5 6.5 5.5 5.5-5.5 5.5"/>
        </symbol>
        <symbol id="i-chevron-up" viewBox="0 0 24 24">
            <path d="m6.5 14.5 5.5-5.5 5.5 5.5"/>
        </symbol>
        <symbol id="i-chevron-down" viewBox="0 0 24 24">
            <path d="m6.5 9.5 5.5 5.5 5.5-5.5"/>
        </symbol>
        <symbol id="i-plus" viewBox="0 0 24 24">
            <path d="M12 5v14M5 12h14"/>
        </symbol>
        <symbol id="i-close" viewBox="0 0 24 24">
            <path d="m6.5 6.5 11 11M17.5 6.5l-11 11"/>
        </symbol>
        <symbol id="i-reset" viewBox="0 0 24 24">
            <path d="M4.5 11.5a7.5 7.5 0 1 1 2.2 5.3"/>
            <path d="M4.5 6.5v5h5"/>
        </symbol>
        <symbol id="i-external" viewBox="0 0 24 24">
            <path d="M14 5h5v5M10 14 19 5M19 13.5V19H5V5h5.5"/>
        </symbol>
        <symbol id="i-spark" viewBox="0 0 24 24">
            <path d="M12 3.5 13.9 9.5 20 11.4l-6.1 1.9L12 19.5l-1.9-6.2L4 11.4l6.1-1.9Z"/>
        </symbol>
    </svg>

    <div class="app-shell" id="app-shell">
        <header class="topbar" id="topbar"></header>
        <main class="main-view" id="main-view"></main>
        <div class="bottom-dock" id="bottom-dock" hidden></div>
    </div>

    <!-- Quick Ask Modal (for Card Editor floating "问 AI" ball) -->
    <div class="sheet-backdrop" id="quick-ask-sheet" hidden>
        <div class="sheet quick-ask-dialog" role="dialog" aria-modal="true" aria-labelledby="quick-ask-title">
            <header class="sheet-header">
                <span class="sheet-title" id="quick-ask-title">问 AI</span>
                <button type="button" class="circle-icon-btn" id="btn-close-quick-ask" aria-label="关闭">
                    <svg><use href="#i-close"/></svg>
                </button>
            </header>
            <div class="quick-ask-body" id="quick-ask-body"></div>
            <div class="quick-ask-footer" id="quick-ask-footer"></div>
        </div>
    </div>

    <!-- Confirm Dialog -->
    <div class="modal-backdrop" id="confirm-modal" hidden>
        <div class="confirm-dialog" role="alertdialog" aria-modal="true" aria-labelledby="confirm-title">
            <h3 class="confirm-title" id="confirm-title"></h3>
            <p class="confirm-desc" id="confirm-desc"></p>
            <div class="confirm-actions">
                <button type="button" class="pill-btn ghost" id="confirm-cancel">取消</button>
                <button type="button" class="pill-btn danger-solid" id="confirm-ok">确认</button>
            </div>
        </div>
    </div>

    <!-- Toast -->
    <div class="toast" id="toast" role="status" aria-live="polite" hidden>
        <span class="toast-msg" id="toast-msg"></span>
        <button type="button" class="toast-action" id="toast-action" hidden></button>
    </div>

    <input id="file-input" type="file" accept=".json,application/json" hidden>
</body>
</html>
