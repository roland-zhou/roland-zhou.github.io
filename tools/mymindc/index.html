<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f6f6f4" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#1b1c1f" media="(prefers-color-scheme: dark)">
    <title>MyMindC</title>
    <link rel="stylesheet" href="./style.css">
    <script type="module" src="./app.js"></script>
</head>
<body>
    <svg class="sprite" aria-hidden="true">
        <symbol id="i-sidebar" viewBox="0 0 24 24"><rect x="3.5" y="4.5" width="17" height="15" rx="2.5"/><path d="M9.5 4.5v15"/></symbol>
        <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
        <symbol id="i-minus" viewBox="0 0 24 24"><path d="M5 12h14"/></symbol>
        <symbol id="i-child" viewBox="0 0 24 24"><rect x="3" y="9" width="7" height="6" rx="1.5"/><path d="M10 12h3c2 0 2-5 4-5h1"/><path d="M18 4v6M15 7h6"/></symbol>
        <symbol id="i-sibling" viewBox="0 0 24 24"><path d="M4 8h9M4 8c3 0 3 8 6 8h3"/><path d="M18 13v6M15 16h6"/></symbol>
        <symbol id="i-task" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="m8.6 12.2 2.3 2.3 4.5-4.8"/></symbol>
        <symbol id="i-circle" viewBox="0 0 24 24"><circle cx="12" cy="12" r="7.5"/></symbol>
        <symbol id="i-circle-check" viewBox="0 0 24 24"><circle cx="12" cy="12" r="7.5" style="fill: currentColor"/><path d="m8.6 12.2 2.3 2.3 4.5-4.8" style="stroke: var(--bg); stroke-width: 2.2"/></symbol>
        <symbol id="i-focus" viewBox="0 0 24 24"><circle cx="12" cy="12" r="7.5"/><circle cx="12" cy="12" r="2.5"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3"/></symbol>
        <symbol id="i-chevron" viewBox="0 0 24 24"><path d="m10 7 5 5-5 5"/></symbol>
        <symbol id="i-note" viewBox="0 0 24 24"><path d="M6.5 3.5h7l4 4v13h-11z"/><path d="M13.5 3.5v4h4M9 12h6M9 15.5h4"/></symbol>
        <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4.5 7h15M9.5 7V4.5h5V7M6.5 7l.8 12.5h9.4L17.5 7M10 11v5M14 11v5"/></symbol>
        <symbol id="i-export" viewBox="0 0 24 24"><path d="M12 4v11M7.5 8.5 12 4l4.5 4.5M5 14v5.5h14V14"/></symbol>
        <symbol id="i-import" viewBox="0 0 24 24"><path d="M12 4v11M7.5 10.5 12 15l4.5-4.5M5 14v5.5h14V14"/></symbol>
        <symbol id="i-undo" viewBox="0 0 24 24"><path d="M9 6 4.5 10.5 9 15"/><path d="M5 10.5h9a5 5 0 0 1 0 10h-3"/></symbol>
        <symbol id="i-redo" viewBox="0 0 24 24"><path d="m15 6 4.5 4.5L15 15"/><path d="M19 10.5h-9a5 5 0 0 0 0 10h3"/></symbol>
        <symbol id="i-help" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M9.6 9.5a2.5 2.5 0 1 1 3.6 2.2c-.8.4-1.2.9-1.2 1.8"/><path d="M12 16.6h.01"/></symbol>
        <symbol id="i-fit" viewBox="0 0 24 24"><path d="M4.5 9V4.5H9M15 4.5h4.5V9M19.5 15v4.5H15M9 19.5H4.5V15"/></symbol>
        <symbol id="i-close" viewBox="0 0 24 24"><path d="m6.5 6.5 11 11M17.5 6.5l-11 11"/></symbol>
        <symbol id="i-select" viewBox="0 0 24 24"><rect x="4" y="5" width="5" height="5" rx="1.2"/><path d="m5.3 7.6 1.1 1.1 1.8-2"/><rect x="4" y="14" width="5" height="5" rx="1.2"/><path d="M12 7.5h8M12 16.5h8"/></symbol>
        <symbol id="i-map" viewBox="0 0 24 24"><rect x="3.5" y="9.5" width="6" height="5" rx="1.5"/><path d="M9.5 12c3 0 2-6 5-6h6M9.5 12c3 0 2 6 5 6h6"/></symbol>
    </svg>

    <div id="canvas" class="canvas" aria-label="思维导图画布">
        <div id="world" class="world">
            <svg id="links" class="links" aria-hidden="true"></svg>
            <div id="nodes" class="nodes"></div>
            <div id="drop-line" class="drop-line" hidden></div>
        </div>
    </div>
    <div id="marquee" class="marquee" hidden></div>

    <div id="doc-bar" class="pill doc-bar">
        <button class="icon-btn" data-cmd="sidebar" title="文件列表" aria-label="文件列表" aria-expanded="false"><svg><use href="#i-sidebar"/></svg></button>
        <button class="icon-btn" data-cmd="new" title="新建导图" aria-label="新建导图"><svg><use href="#i-plus"/></svg></button>
        <span class="sep"></span>
        <button id="map-title" class="map-title" data-cmd="edit-root" title="编辑中心主题"></button>
    </div>

    <div class="pill tool-bar">
        <button class="icon-btn" data-cmd="undo" title="撤销 (⌘Z)" aria-label="撤销"><svg><use href="#i-undo"/></svg></button>
        <button class="icon-btn" data-cmd="redo" title="重做 (⇧⌘Z)" aria-label="重做"><svg><use href="#i-redo"/></svg></button>
        <span class="sep"></span>
        <button class="icon-btn" data-cmd="focus" title="专注模式 (⌥F)" aria-label="专注模式" aria-pressed="false"><svg><use href="#i-focus"/></svg></button>
        <button class="icon-btn" data-cmd="export" title="导出 OPML" aria-label="导出 OPML"><svg><use href="#i-export"/></svg></button>
        <button class="icon-btn" data-cmd="help" title="快捷键" aria-label="快捷键"><svg><use href="#i-help"/></svg></button>
    </div>

    <div id="node-bar" class="pill node-bar" hidden>
        <span id="multi-count" class="multi-count" data-multi></span>
        <button class="icon-btn" data-single data-cmd="child" title="新建子节点 (Tab)" aria-label="新建子节点"><svg><use href="#i-child"/></svg></button>
        <button class="icon-btn" data-single data-cmd="sibling" title="新建同级节点 (Enter)" aria-label="新建同级节点"><svg><use href="#i-sibling"/></svg></button>
        <span class="sep" data-single></span>
        <button class="icon-btn" data-cmd="task" title="待办 (⌥T)" aria-label="待办" aria-pressed="false"><svg><use href="#i-task"/></svg></button>
        <button class="icon-btn" data-single data-cmd="note" title="备注 (⌥N)" aria-label="备注" aria-pressed="false"><svg><use href="#i-note"/></svg></button>
        <span class="sep"></span>
        <button class="icon-btn" data-cmd="delete" title="删除节点 (Delete)" aria-label="删除节点"><svg><use href="#i-trash"/></svg></button>
    </div>

    <div class="pill zoom-bar">
        <button class="icon-btn" data-cmd="zoom-out" title="缩小" aria-label="缩小"><svg><use href="#i-minus"/></svg></button>
        <button id="zoom-label" class="zoom-label" data-cmd="zoom-reset" title="实际大小">100%</button>
        <button class="icon-btn" data-cmd="zoom-in" title="放大" aria-label="放大"><svg><use href="#i-plus"/></svg></button>
        <button class="icon-btn" data-cmd="fit" title="适应窗口" aria-label="适应窗口"><svg><use href="#i-fit"/></svg></button>
    </div>

    <aside id="sidebar" class="panel sidebar" aria-label="文件" hidden>
        <header class="sidebar-head">
            <span class="brand"><svg><use href="#i-map"/></svg>MyMindC</span>
            <button class="icon-btn" data-cmd="sidebar" title="收起" aria-label="收起文件列表"><svg><use href="#i-sidebar"/></svg></button>
        </header>
        <div class="sidebar-actions">
            <button class="text-btn" data-cmd="new"><svg><use href="#i-plus"/></svg>新建</button>
            <button class="text-btn" data-cmd="import"><svg><use href="#i-import"/></svg>导入</button>
            <button class="text-btn" id="select-toggle" data-cmd="select-mode"><svg><use href="#i-select"/></svg>多选</button>
        </div>
        <ul id="file-list" class="file-list"></ul>
        <footer id="batch-bar" class="batch-bar" hidden>
            <button class="text-btn" data-cmd="select-all" id="select-all">全选</button>
            <span id="batch-count" class="batch-count"></span>
            <button class="icon-btn" data-cmd="batch-export" title="导出所选" aria-label="导出所选"><svg><use href="#i-export"/></svg></button>
            <button class="icon-btn danger" data-cmd="batch-delete" title="删除所选" aria-label="删除所选"><svg><use href="#i-trash"/></svg></button>
        </footer>
    </aside>

    <section id="note-panel" class="panel note-panel" hidden>
        <header>
            <span class="note-label"><svg><use href="#i-note"/></svg><span id="note-title" class="note-title"></span></span>
            <button class="icon-btn" data-cmd="close-note" aria-label="关闭备注"><svg><use href="#i-close"/></svg></button>
        </header>
        <textarea id="note-text" placeholder="添加备注…" aria-label="备注"></textarea>
    </section>

    <section id="help" class="panel help" hidden>
        <header>
            <span>快捷键</span>
            <button class="icon-btn" data-cmd="help" aria-label="关闭"><svg><use href="#i-close"/></svg></button>
        </header>
        <dl id="help-list"></dl>
    </section>

    <div id="toast" class="toast" role="status" hidden></div>
    <input id="file-input" type="file" accept=".opml,.xml,text/x-opml,application/xml,text/xml" multiple hidden>
</body>
</html>
